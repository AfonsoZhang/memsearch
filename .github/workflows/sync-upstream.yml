name: Sync upstream

on:
  schedule:
    - cron: "0 0 * * *" # 08:00 Asia/Shanghai
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fork-upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'AfonsoZhang/memsearch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout fork main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          ssh-key: ${{ secrets.MEMSEARCH_UPSTREAM_SYNC_KEY }}

      - name: Merge upstream main
        id: sync
        shell: bash
        run: |
          set -euo pipefail
          git remote add upstream https://github.com/zilliztech/memsearch.git
          git fetch --no-tags upstream main
          upstream_sha="$(git rev-parse upstream/main)"
          echo "upstream_sha=$upstream_sha" >> "$GITHUB_OUTPUT"
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No new upstream commits." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git merge --no-edit upstream/main
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "Merged upstream $upstream_sha into fork main at $(git rev-parse HEAD)." >> "$GITHUB_STEP_SUMMARY"
