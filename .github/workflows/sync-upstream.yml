name: Sync upstream

on:
  schedule:
    - cron: "23 1 * * *" # 09:23 Asia/Shanghai
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: fork-upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'AfonsoZhang/memsearch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Sync fork through the GitHub API
        id: sync
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          ahead="$(gh api "repos/$GITHUB_REPOSITORY/compare/main...zilliztech:main" --jq .ahead_by)"
          if [ "$ahead" -eq 0 ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No new upstream commits." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # The dedicated fork-sync API needs contents:write and preserves
          # fork-only commits. A merge conflict fails without force-pushing.
          gh api --method POST "repos/$GITHUB_REPOSITORY/merge-upstream" -f branch=main
          synced_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)"
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "Merged $ahead upstream commits into fork main at $synced_sha." >> "$GITHUB_STEP_SUMMARY"
      - name: Run CI on the updated fork
        if: steps.sync.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          # A push with GITHUB_TOKEN does not trigger push workflows.
          # Explicit dispatch creates CI runs on the updated main commit.
          gh workflow run test.yml --repo "$GITHUB_REPOSITORY" --ref main
          gh workflow run lint.yml --repo "$GITHUB_REPOSITORY" --ref main
          echo "Dispatched Test and Lint on main. Their results are separate from sync success." >> "$GITHUB_STEP_SUMMARY"
